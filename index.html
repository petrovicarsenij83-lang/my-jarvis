
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S.</title>

<style>
:root {
    --bg: #060d1a;
    --main: #00e5ff;
    --glow: rgba(0,229,255,.4);
    --panel: rgba(0,15,30,.65);
    --border: #00e5ff;
}

.theme-mark1 {
    --bg:#15181c;
    --main:#e0e0e0;
    --glow:rgba(255,255,255,.2);
    --panel:rgba(40,45,50,.65);
    --border:#777;
}

.theme-mark2 {
    --bg:#0f141d;
    --main:#a4c2f4;
    --glow:rgba(164,194,244,.5);
    --panel:rgba(20,30,45,.65);
    --border:#a4c2f4;
}

.theme-mark3 {
    --bg:#220505;
    --main:#ffcc00;
    --glow:rgba(255,204,0,.4);
    --panel:rgba(80,10,10,.65);
    --border:#ff3333;
}

.theme-mark50 {
    --bg:#1a020d;
    --main:#00ffcc;
    --glow:rgba(0,255,204,.5);
    --panel:rgba(60,5,25,.65);
    --border:#ff0055;
}

* {
    box-sizing:border-box;
}

body {
    background:
        radial-gradient(circle at center, rgba(0,229,255,.08), transparent 45%),
        var(--bg);

    color:var(--main);
    font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    min-height:100vh;
    margin:0;
    padding:20px;

    overflow:hidden;
    transition:.4s;
}

.control-panel {
    position:absolute;
    top:20px;
    right:20px;

    display:flex;
    flex-direction:column;
    gap:8px;

    background:rgba(0,0,0,.45);
    padding:12px;

    border:1px solid var(--main);
    border-radius:8px;

    box-shadow:0 0 15px var(--glow);
}

.control-panel label {
    font-size:10px;
    font-weight:bold;
    letter-spacing:1px;
}

select {
    background:#000;
    color:var(--main);

    border:1px solid var(--main);
    border-radius:4px;

    padding:6px;

    outline:none;
}

.custom-color-row {
    display:flex;
    align-items:center;
    gap:10px;
}

input[type="color"] {
    width:28px;
    height:28px;
    border:0;
    background:transparent;
}

.core {
    width:140px;
    height:140px;

    border:3px solid var(--main);
    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    font-weight:bold;
    letter-spacing:3px;

    cursor:pointer;

    box-shadow:
        0 0 25px var(--glow),
        inset 0 0 25px rgba(0,229,255,.05);

    text-shadow:0 0 12px var(--main);

    transition:.3s;

    user-select:none;
}

.core:hover {
    transform:scale(1.04);
}

.listening {
    animation:pulse 1s infinite alternate;

    border-color:#ff0055 !important;
    color:#ff0055 !important;

    box-shadow:
        0 0 50px #ff0055 !important;
}

@keyframes pulse {
    from { transform:scale(1); }
    to { transform:scale(1.08); }
}

.status {
    margin-top:15px;
    margin-bottom:15px;

    font-size:11px;
    letter-spacing:2px;

    text-align:center;
}

#log {
    width:90%;
    max-width:600px;

    height:260px;

    border:1px solid rgba(255,255,255,.15);

    background:var(--panel);

    padding:15px;

    overflow-y:auto;

    border-radius:8px;

    backdrop-filter:blur(8px);

    box-shadow:0 0 20px rgba(0,0,0,.3);
}

.u-line {
    color:#fff;
    margin-bottom:8px;
}

.j-line {
    color:var(--main);
    font-weight:bold;
    margin-bottom:14px;

    text-shadow:0 0 5px var(--glow);
}

.error-line {
    color:#ff4466;
    font-weight:bold;
    margin-bottom:14px;
}

.input-area {
    display:flex;

    width:90%;
    max-width:600px;

    gap:10px;

    margin-top:15px;
}

input[type="text"] {
    flex:1;

    background:rgba(0,0,0,.5);

    border:1px solid var(--border);

    color:white;

    padding:12px;

    border-radius:5px;

    font-size:15px;

    outline:none;
}

input[type="text"]:focus {
    box-shadow:0 0 12px var(--glow);
}

button {
    border:none;
    border-radius:5px;

    padding:12px 16px;

    font-weight:bold;

    cursor:pointer;
}

.send-btn {
    background:var(--main);
    color:#06101a;
}

.send-btn:disabled {
    opacity:.5;
    cursor:not-allowed;
}

@media(max-width:600px) {

    .control-panel {
        top:10px;
        right:10px;
        transform:scale(.85);
        transform-origin:top right;
    }

    .core {
        width:120px;
        height:120px;
    }

    #log {
        height:220px;
    }

    .input-area {
        width:95%;
    }
}
</style>
</head>

<body>

<div class="control-panel">

    <label>ГОТОВАЯ БРОНЯ:</label>

    <select id="armor-select">

        <option value="default">
            J.A.R.V.I.S. СТАНДАРТ
        </option>

        <option value="mark1">
            MARK I (ПЕЩЕРА)
        </option>

        <option value="mark2">
            MARK II (ХРОМ)
        </option>

        <option value="mark3">
            MARK III (КЛАССИКА)
        </option>

        <option value="mark50">
            MARK L (НАНО)
        </option>

    </select>

    <div class="custom-color-row">

        <label>СВОЙ ЦВЕТ:</label>

        <input
            type="color"
            id="color-picker"
            value="#00e5ff"
        >

    </div>

</div>


<div
    class="core"
    id="voice-btn"
>
    JARVIS
</div>


<div
    class="status"
    id="status"
>
    СИСТЕМА СВЯЗИ ГОТОВА
</div>


<div id="log">

    <div class="j-line">
        Джарвис: Система J.A.R.V.I.S. активирована, сэр.
        Центральный интеллект готов к работе.
    </div>

</div>


<div class="input-area">

    <input
        type="text"
        id="user-input"
        placeholder="Написать Джарвису..."
        autocomplete="off"
    >

    <button
        class="send-btn"
        id="send-btn"
    >
        ВВОД
    </button>

</div>


<script>

const status =
    document.getElementById("status");

const log =
    document.getElementById("log");

const userInput =
    document.getElementById("user-input");

const sendBtn =
    document.getElementById("send-btn");

const voiceBtn =
    document.getElementById("voice-btn");

const armorSelect =
    document.getElementById("armor-select");

const colorPicker =
    document.getElementById("color-picker");


// ================================
// ЗВУК
// ================================

function unlockAudio() {

    if ("speechSynthesis" in window) {

        const u =
            new SpeechSynthesisUtterance("");

        window.speechSynthesis.speak(u);
    }
}


function speak(text) {

    if (!("speechSynthesis" in window))
        return;

    window.speechSynthesis.cancel();

    const speech =
        new SpeechSynthesisUtterance(text);

    speech.lang = "ru-RU";
    speech.rate = 1;
    speech.pitch = 0.9;

    window.speechSynthesis.speak(speech);
}


// ================================
// ДОБАВЛЕНИЕ СООБЩЕНИЙ
// ================================

function addMessage(type, text) {

    const div =
        document.createElement("div");

    if (type === "user") {

        div.className = "u-line";
        div.textContent = "Вы: " + text;

    } else if (type === "jarvis") {

        div.className = "j-line";
        div.textContent = "Джарвис: " + text;

    } else {

        div.className = "error-line";
        div.textContent = "Система: " + text;
    }

    log.appendChild(div);

    log.scrollTop =
        log.scrollHeight;
}


// ================================
// ГЛАВНАЯ ФУНКЦИЯ ИИ
// ================================

async function askJarvis(text) {

    text = text.trim();

    if (!text)
        return;

    unlockAudio();

    addMessage("user", text);

    userInput.value = "";

    sendBtn.disabled = true;

    status.innerText =
        "СВЯЗЬ С ЦЕНТРАЛЬНЫМ ИНТЕЛЛЕКТОМ...";

    try {

        const response =
            await fetch("/api/chat", {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    message: text
                })

            });


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Сервер вернул ошибку"
            );
        }


        if (!data.reply) {

            throw new Error(
                "ИИ не вернул ответ"
            );
        }


        addMessage(
            "jarvis",
            data.reply
        );


        status.innerText =
            "СИСТЕМА СВЯЗИ ГОТОВА";


        speak(data.reply);


    } catch (error) {

        console.error(error);

        addMessage(
            "error",
            "Сэр, произошла ошибка соединения с центральным интеллектом: " +
            error.message
        );

        status.innerText =
            "ОШИБКА СИСТЕМЫ";

    } finally {

        sendBtn.disabled = false;

        userInput.focus();
    }
}


// ================================
// КНОПКА ВВОДА
// ================================

sendBtn.addEventListener(
    "click",
    () => {

        askJarvis(
            userInput.value
        );

    }
);


// ================================
// ENTER
// ================================

userInput.addEventListener(
    "keydown",
    event => {

        if (event.key === "Enter") {

            event.preventDefault();

            askJarvis(
                userInput.value
            );
        }

    }
);


// ================================
// ГОЛОС
// ================================

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if (SpeechRecognition) {

    const recognition =
        new SpeechRecognition();

    recognition.lang = "ru-RU";

    recognition.interimResults = false;

    recognition.continuous = false;


    voiceBtn.addEventListener(
        "click",
        () => {

            unlockAudio();

            try {

                recognition.start();

                voiceBtn.classList.add(
                    "listening"
                );

                status.innerText =
                    "СЛУШАЮ ВАС, СЭР...";

            } catch (error) {

                console.log(error);

            }

        }
    );


    recognition.onresult =
        event => {

            const text =
                event.results[0][0].transcript;

            if (text) {

                askJarvis(text);
            }

        };


    recognition.onerror =
        event => {

            console.error(
                "Speech error:",
                event.error
            );

            status.innerText =
                "ГОЛОС НЕ РАСПОЗНАН";

        };


    recognition.onend =
        () => {

            voiceBtn.classList.remove(
                "listening"
            );

            if (
                status.innerText ===
                "СЛУШАЮ ВАС, СЭР..."
            ) {

                status.innerText =
                    "СИСТЕМА СВЯЗИ ГОТОВА";
            }

        };

} else {

    status.innerText =
        "ГОЛОСОВОЙ ВВОД НЕ ПОДДЕРЖИВАЕТСЯ";
}


// ================================
// БРОНЯ
// ================================

armorSelect.addEventListener(
    "change",
    event => {

        document.body.className = "";

        const selected =
            event.target.value;

        if (selected !== "default") {

            document.body.classList.add(
                "theme-" + selected
            );

        } else {

            document.documentElement
                .style
                .setProperty(
                    "--main",
                    "#00e5ff"
                );

            document.documentElement
                .style
                .setProperty(
                    "--glow",
                    "rgba(0,229,255,.4)"
                );

        }

    }
);


// ================================
// СВОЙ ЦВЕТ
// ================================

colorPicker.addEventListener(
    "input",
    event => {

        const hex =
            event.target.value;

        armorSelect.value =
            "default";

        document.body.className = "";

        document.documentElement
            .style
            .setProperty(
                "--main",
                hex
            );


        const r =
            parseInt(hex.substring(1,3),16);

        const g =
            parseInt(hex.substring(3,5),16);

        const b =
            parseInt(hex.substring(5,7),16);


        document.documentElement
            .style
            .setProperty(
                "--glow",
                `rgba(${r},${g},${b},.4)`
            );

    }
);

</script>

</body>
</html>
