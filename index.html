<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>J.A.R.V.I.S. Control Panel</title>
<style>
:root{--bg:#060d1a;--main:#00e5ff;--glow:rgba(0,229,255,.45);--panel:rgba(0,15,30,.7);--border:#00e5ff;--button-text:#00151d}
body.theme-mark1{--bg:#17120e;--main:#c58b55;--glow:rgba(197,139,85,.45);--panel:rgba(35,25,18,.75);--border:#c58b55;--button-text:#21140b}
body.theme-mark2{--bg:#11161b;--main:#dce7ed;--glow:rgba(220,231,237,.45);--panel:rgba(30,35,40,.75);--border:#b9c5cc;--button-text:#11161b}
body.theme-mark3{--bg:#180407;--main:#ffcc36;--glow:rgba(255,80,40,.5);--panel:rgba(50,5,8,.75);--border:#ff3344;--button-text:#240000}
body.theme-mark42{--bg:#12040a;--main:#ff4b3e;--glow:rgba(255,65,45,.55);--panel:rgba(45,5,10,.75);--border:#ffb52e;--button-text:#260300}
body.theme-mark48{--bg:#090b10;--main:#d92735;--glow:rgba(220,30,45,.5);--panel:rgba(20,22,28,.8);--border:#8e9aa5;--button-text:#fff}
body.theme-america{--bg:#050b18;--main:#fff;--glow:rgba(50,120,255,.5);--panel:rgba(5,15,35,.8);--border:#e63946;--button-text:#07152e}
body.theme-mark50{--bg:#050b0d;--main:#00ffcc;--glow:rgba(0,255,204,.5);--panel:rgba(0,25,25,.75);--border:#ff1744;--button-text:#001f1a}
body.theme-mark85{--bg:#160304;--main:#ffd34e;--glow:rgba(255,70,40,.55);--panel:rgba(50,4,5,.78);--border:#ff2638;--button-text:#250000}
*{box-sizing:border-box}
body{background:radial-gradient(circle at center,var(--main),var(--bg) 65%);background-blend-mode:soft-light;color:var(--main);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;transition:background .5s,color .5s}
.control-panel{position:absolute;top:20px;right:20px;display:flex;flex-direction:column;gap:8px;padding:12px;background:var(--panel);border:1px solid var(--border);border-radius:8px;box-shadow:0 0 18px var(--glow);backdrop-filter:blur(10px);z-index:20}
.control-panel label{font-size:10px;font-weight:bold;letter-spacing:1px}
select{background:#000;color:var(--main);border:1px solid var(--border);border-radius:5px;padding:7px;font-size:12px;font-weight:bold;outline:none}
.core{width:145px;height:145px;border:3px solid var(--main);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;font-weight:bold;letter-spacing:3px;text-shadow:0 0 10px var(--main);box-shadow:0 0 25px var(--glow),0 0 60px var(--glow);background:rgba(255,255,255,.02);margin-bottom:8px;transition:.3s}
.core:hover{transform:scale(1.04)}
.core.listening{animation:pulse .8s infinite alternate;border-color:#ff1744;color:#ff1744;box-shadow:0 0 30px #ff1744,0 0 70px #ff1744}
.core.speaking{animation:pulse .65s infinite alternate}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.06)}}
.status{font-size:11px;letter-spacing:3px;text-transform:uppercase;text-align:center;margin-bottom:15px;max-width:90%}
#log{width:85%;max-width:600px;height:250px;padding:15px;overflow-y:auto;border:1px solid var(--border);border-radius:7px;background:var(--panel);backdrop-filter:blur(10px);font-size:14px;margin-bottom:15px;box-shadow:0 0 15px var(--glow)}
.u-line{color:#fff;margin-bottom:9px}
.j-line{color:var(--main);font-weight:bold;margin-bottom:15px}
.input-area{width:85%;max-width:600px;display:flex;gap:10px}
input[type=text]{flex:1;min-width:0;background:rgba(0,0,0,.55);color:#fff;border:1px solid var(--border);border-radius:5px;padding:12px;font-size:14px;outline:none}
button.send-btn{background:var(--main);color:var(--button-text);border:none;border-radius:5px;padding:10px 17px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
@media(max-width:650px){.control-panel{top:10px;right:10px}.core{width:125px;height:125px}#log,.input-area{width:92%}#log{height:230px}}
</style>
</head>
<body>
<div class="control-panel">
  <label>ВЫБОР ИНТЕРФЕЙСА</label>
  <select id="armor-select">
    <option value="jarvis">J.A.R.V.I.S. — СИНИЙ</option>
    <option value="mark1">MARK I</option>
    <option value="mark2">MARK II</option>
    <option value="mark3">MARK III</option>
    <option value="mark42">MARK XLII</option>
    <option value="mark48">MARK XLVIII</option>
    <option value="america">MARK — AMERICAN FLAG 🇺🇸</option>
    <option value="mark50">MARK L — NANOTECH</option>
    <option value="mark85">MARK LXXXV</option>
  </select>
  <label>ЯЗЫК МИКРОФОНА</label>
  <select id="lang-select">
    <option value="ru-RU">Русский</option>
    <option value="en-US">English</option>
    <option value="uk-UA">Українська</option>
  </select>
</div>

<div class="core" id="voice-btn">JARVIS</div>
<div class="status" id="status">СИСТЕМА СВЯЗИ ГОТОВА</div>
<div id="log"><div class="j-line">Джарвис: Система J.A.R.V.I.S. активирована, сэр.</div></div>
<div class="input-area">
  <input type="text" id="user-input" placeholder="Написать Джарвису..." autocomplete="off">
  <button class="send-btn" id="send-btn">ВВОД</button>
</div>

<script>
const status = document.getElementById("status");
const log = document.getElementById("log");
const userInput = document.getElementById("user-input");
const sendBtn = document.getElementById("send-btn");
const voiceBtn = document.getElementById("voice-btn");
const armorSelect = document.getElementById("armor-select");
const langSelect = document.getElementById("lang-select");
const READY = "СИСТЕМА СВЯЗИ ГОТОВА";

function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

/* THEME + MIC LANGUAGE */
const savedTheme = load("jarvis-theme");
if (savedTheme) { document.body.className = "theme-" + savedTheme; armorSelect.value = savedTheme; }
armorSelect.addEventListener("change", () => {
  document.body.className = "theme-" + armorSelect.value;
  store("jarvis-theme", armorSelect.value);
});
const savedLang = load("jarvis-lang");
if (savedLang) langSelect.value = savedLang;
langSelect.addEventListener("change", () => store("jarvis-lang", langSelect.value));

/* MEMORY */
let history = [];

/* AUDIO */
let currentAudio = null, audioUnlocked = false;

function unlockAudio() {
  if (audioUnlocked) return;
  try {
    const a = new Audio();
    a.volume = 0;
    a.src = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=";
    a.play().catch(() => {});
    audioUnlocked = true;
  } catch (e) {}
}

function stopSpeaking() {
  if (currentAudio) { try { currentAudio.pause(); } catch (e) {} currentAudio = null; }
  voiceBtn.classList.remove("speaking");
}

async function speak(text) {
  stopSpeaking();
  voiceBtn.classList.add("speaking");
  status.innerText = "ДЖАРВИС ГОВОРИТ, СЭР...";
  try {
    const r = await fetch("/api/tts", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text })
    });
    if (!r.ok) throw new Error("tts");
    const blob = await r.blob();
    if (blob.size < 100) throw new Error("empty");
    const url = URL.createObjectURL(blob);
    const audio = new Audio(url);
    currentAudio = audio;
    const done = msg => {
      URL.revokeObjectURL(url);
      if (currentAudio === audio) currentAudio = null;
      voiceBtn.classList.remove("speaking");
      status.innerText = msg;
    };
    audio.onended = () => done(READY);
    audio.onerror = () => done("ОШИБКА ВОСПРОИЗВЕДЕНИЯ");
    await audio.play();
  } catch (e) {
    voiceBtn.classList.remove("speaking");
    status.innerText = "ГОЛОС НЕДОСТУПЕН, ОТВЕТ В ТЕКСТЕ";
  }
}

/* CHAT */
function addLine(cls, prefix, text) {
  const d = document.createElement("div");
  d.className = cls;
  d.textContent = prefix + text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
}

async function askJarvis(text) {
  text = String(text || "").trim();
  if (!text) return;
  unlockAudio();
  addLine("u-line", "Вы: ", text);
  status.innerText = "ОБРАБОТКА ДАННЫХ...";
  sendBtn.disabled = userInput.disabled = true;
  try {
    const r = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, history })
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok || !data.answer) throw new Error(data.error || "Сервер не ответил.");
    const answer = String(data.answer).trim();
    history.push({ role: "user", content: text }, { role: "assistant", content: answer });
    history = history.slice(-10);
    addLine("j-line", "Джарвис: ", answer);
    await speak(answer);
  } catch (e) {
    addLine("j-line", "Джарвис: ", e.message || "Связь нестабильна. Повторите запрос, сэр.");
    status.innerText = "ПОВТОРИТЕ ЗАПРОС";
  } finally {
    sendBtn.disabled = userInput.disabled = false;
    userInput.focus();
  }
}

sendBtn.addEventListener("click", () => {
  const t = userInput.value.trim();
  if (!t) return;
  userInput.value = "";
  askJarvis(t);
});
userInput.addEventListener("keydown", e => {
  if (e.key === "Enter") { e.preventDefault(); sendBtn.click(); }
});

/* MICROPHONE */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null, listening = false, voiceText = "";

if (SR) {
  recognition = new SR();
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.onstart = () => {
    listening = true; voiceText = "";
    voiceBtn.classList.add("listening");
    voiceBtn.innerText = "СТОП";
    status.innerText = "СЛУШАЮ ВАС, СЭР...";
  };
  recognition.onresult = e => {
    const t = e.results?.[0]?.[0]?.transcript?.trim();
    if (t) { voiceText = t; status.innerText = "УСЛЫШАЛ: " + t; }
  };
  recognition.onerror = e => {
    const m = { "not-allowed": "РАЗРЕШИТЕ МИКРОФОН В БРАУЗЕРЕ", "no-speech": "Я НЕ УСЛЫШАЛ ВАС, СЭР", "audio-capture": "МИКРОФОН НЕДОСТУПЕН" };
    status.innerText = m[e.error] || "ОШИБКА МИКРОФОНА";
  };
  recognition.onend = () => {
    listening = false;
    voiceBtn.classList.remove("listening");
    voiceBtn.innerText = "JARVIS";
    if (voiceText) { const t = voiceText; voiceText = ""; askJarvis(t); }
  };
  voiceBtn.addEventListener("click", () => {
    unlockAudio();
    stopSpeaking();
    if (listening) { recognition.stop(); return; }
    recognition.lang = langSelect.value;
    try { recognition.start(); } catch (e) {}
  });
} else {
  status.innerText = "ГОЛОСОВОЙ ВВОД НЕ ПОДДЕРЖИВАЕТСЯ";
}
</script>
</body>
</html>
