<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. Custom OS</title>
    <style>
        :root {
            --bg-color: #050b14;
            --main-color: #00e5ff;
            --main-glow: rgba(0, 229, 255, 0.4);
        }

        body {
            background-color: var(--bg-color); color: var(--main-color);
            font-family: system-ui, -apple-system, sans-serif;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            height: 90vh; margin: 0; overflow: hidden;
            transition: color 0.3s ease;
        }
        
        /* Скрытый пульт выбора цвета */
        .color-picker-panel {
            position: absolute; top: 20px; right: 20px;
            display: flex; align-items: center; gap: 10px;
            background: rgba(0, 20, 40, 0.6); padding: 8px 12px;
            border-radius: 6px; border: 1px solid var(--main-color);
            font-size: 11px; font-weight: bold; letter-spacing: 1px;
        }
        
        input[type="color"] {
            -webkit-appearance: none; border: none; width: 30px; height: 30px;
            border-radius: 50%; cursor: pointer; background: transparent; outline: none;
        }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: 2px solid #fff; border-radius: 50%; box-shadow: 0 0 10px rgba(0,0,0,0.5); }

        .core {
            width: 130px; height: 130px;
            border: 3px solid var(--main-color); border-radius: 50%;
            box-shadow: 0 0 30px var(--main-glow);
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; cursor: pointer; text-shadow: 0 0 10px var(--main-color);
            background: rgba(255, 255, 255, 0.01); margin-bottom: 5px;
            transition: border-color 0.3s, box-shadow 0.3s, text-shadow 0.3s;
            letter-spacing: 2px;
        }
        .core:active { transform: scale(0.95); }
        .listening { animation: pulse 1.5s infinite alternate; border-color: #ff0055 !important; box-shadow: 0 0 40px #ff0055 !important; text-shadow: 0 0 10px #ff0055 !important; color: #ff0055 !important; }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }
        .status { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 15px; text-align: center; }
        #log {
            width: 85%; max-width: 500px; height: 180px;
            border: 1px solid rgba(255, 255, 255, 0.1); background: rgba(0, 10, 25, 0.6);
            padding: 15px; overflow-y: auto; font-size: 14px; border-radius: 6px; margin-bottom: 15px;
        }
        .u-line { color: #fff; margin-bottom: 6px; }
        .j-line { color: var(--main-color); margin-bottom: 12px; font-weight: bold; }
        .input-area { display: flex; width: 85%; max-width: 500px; gap: 10px; }
        input[type="text"] {
            flex: 1; background: rgba(0, 0, 0, 0.4); border: 1px solid var(--main-color);
            color: #fff; padding: 10px; border-radius: 4px; font-size: 14px; outline: none;
            transition: border-color 0.3s;
        }
        button.send-btn {
            background: var(--main-color); border: none; color: #060d1a;
            padding: 10px 15px; border-radius: 4px; font-weight: bold; cursor: pointer;
            transition: background-color 0.3s;
        }
    </style>
</head>
<body>

    <div class="color-picker-panel">
        <span id="picker-label">ИНТЕРФЕЙС БРОНИ:</span>
        <input type="color" id="color-picker" value="#00e5ff">
    </div>

    <div class="core" id="voice-btn">JARVIS</div>
    <div class="status" id="status">НАЖМИТЕ НА КРУГ ДЛЯ ГОЛОСА ИЛИ НАПИШИТЕ ТЕКСТ</div>
    <div id="log"></div>
    
    <div class="input-area">
        <input type="text" id="user-input" placeholder="Написать Джарвису..." autocomplete="off">
        <button class="send-btn" id="send-btn">ВВОД</button>
    </div>

    <script>
        const status = document.getElementById('status');
        const log = document.getElementById('log');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const voiceBtn = document.getElementById('voice-btn');
        const colorPicker = document.getElementById('color-picker');

        // Живое изменение всех цветов интерфейса на iPad
        colorPicker.addEventListener('input', (e) => {
            const hexColor = e.target.value;
            document.documentElement.style.setProperty('--main-color', hexColor);
            
            // Вычисляем мягкое нано-свечение на основе выбранного цвета
            const r = parseInt(hexColor.substr(1,2), 16);
            const g = parseInt(hexColor.substr(3,2), 16);
            const b = parseInt(hexColor.substr(5,2), 16);
            document.documentElement.style.setProperty('--main-glow', `rgba(${r}, ${g}, ${b}, 0.4)`);
        });

        function unlockAudioiOS() {
            const initialSilence = new SpeechSynthesisUtterance("");
            window.speechSynthesis.speak(initialSilence);
        }

        function audioVoice(text) {
            window.speechSynthesis.cancel();
            const speech = new SpeechSynthesisUtterance(text);
            speech.lang = 'ru-RU';
            window.speechSynthesis.speak(speech);
        }

        async function askJarvis(text) {
            log.innerHTML += `<div class="u-line">Вы: ${text}</div>`;
            log.scrollTop = log.scrollHeight;
            status.innerText = "ПОДКЛЮЧЕНИЕ К СПУТНИКОВОЙ СЕТИ...";

            try {
                const response = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: text })
                });

                const data = await response.json();
                const reply = data.reply;
                
                log.innerHTML += `<div class="j-line">Джарвис: ${reply}</div>`;
                log.scrollTop = log.scrollHeight;
                status.innerText = "СИСТЕМА СВЯЗИ ГОТОВА";
                
                audioVoice(reply);
            } catch (err) {
                status.innerText = "ОШИБКА СЕРВЕРА.";
                console.error(err);
            }
        }

        function handleTextInput() {
            unlockAudioiOS();
            const text = userInput.value.trim();
            if (!text) return;
            userInput.value = '';
            askJarvis(text);
        }

        sendBtn.addEventListener('click', handleTextInput);
        userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleTextInput(); });

        const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (Speech) {
            const rec = new Speech();
            rec.lang = 'ru-RU';

            voiceBtn.addEventListener('click', () => {
                unlockAudioiOS();
                try { 
                    rec.start(); 
                    status.innerText = "СЛУШАЮ ВАС, СЭР..."; 
                    voiceBtn.classList.add('listening');
                } catch(e) { 
                    rec.stop(); 
                }
            });

            rec.onresult = (e) => {
                const speechResult = e.results.transcript;
                if (speechResult) askJarvis(speechResult);
            };

            rec.onerror = () => { status.innerText = "ГОЛОС НЕ РАСПОЗНАН"; };
            rec.onend = () => { 
                voiceBtn.classList.remove('listening');
                if(status.innerText === "СЛУШАЮ ВАС, СЭР...") status.innerText = "СИСТЕМА СВЯЗИ ГОТОВА"; 
            };
        } else {
            status.innerText = "МИКРОФОН НЕ ПОДДЕРЖИВАЕТСЯ.";
        }
    </script>
</body>
</html>
