<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>J.A.R.V.I.S. Control Panel</title>

<style>

:root {
    --bg: #060d1a;
    --main: #00e5ff;
    --glow: rgba(0,229,255,0.45);
    --panel: rgba(0,15,30,0.70);
    --border: #00e5ff;
    --button-text: #00151d;
}

/* =====================================================
   THEMES
===================================================== */

body.theme-jarvis {
    --bg:#060d1a;
    --main:#00e5ff;
    --glow:rgba(0,229,255,.45);
    --panel:rgba(0,15,30,.70);
    --border:#00e5ff;
    --button-text:#00151d;
}

body.theme-mark1 {
    --bg:#17120e;
    --main:#c58b55;
    --glow:rgba(197,139,85,.45);
    --panel:rgba(35,25,18,.75);
    --border:#c58b55;
    --button-text:#21140b;
}

body.theme-mark2 {
    --bg:#11161b;
    --main:#dce7ed;
    --glow:rgba(220,231,237,.45);
    --panel:rgba(30,35,40,.75);
    --border:#b9c5cc;
    --button-text:#11161b;
}

body.theme-mark3 {
    --bg:#180407;
    --main:#ffcc36;
    --glow:rgba(255,80,40,.50);
    --panel:rgba(50,5,8,.75);
    --border:#ff3344;
    --button-text:#240000;
}

body.theme-mark42 {
    --bg:#12040a;
    --main:#ff4b3e;
    --glow:rgba(255,65,45,.55);
    --panel:rgba(45,5,10,.75);
    --border:#ffb52e;
    --button-text:#260300;
}

body.theme-mark48 {
    --bg:#090b10;
    --main:#d92735;
    --glow:rgba(220,30,45,.50);
    --panel:rgba(20,22,28,.80);
    --border:#8e9aa5;
    --button-text:#ffffff;
}

body.theme-america {
    --bg:#050b18;
    --main:#ffffff;
    --glow:rgba(50,120,255,.50);
    --panel:rgba(5,15,35,.80);
    --border:#e63946;
    --button-text:#07152e;
}

body.theme-mark50 {
    --bg:#050b0d;
    --main:#00ffcc;
    --glow:rgba(0,255,204,.50);
    --panel:rgba(0,25,25,.75);
    --border:#ff1744;
    --button-text:#001f1a;
}

body.theme-mark85 {
    --bg:#160304;
    --main:#ffd34e;
    --glow:rgba(255,70,40,.55);
    --panel:rgba(50,4,5,.78);
    --border:#ff2638;
    --button-text:#250000;
}

/* =====================================================
   GLOBAL
===================================================== */

* {
    box-sizing:border-box;
}

body {

    background:
        radial-gradient(
            circle at center,
            var(--main),
            var(--bg) 65%
        );

    background-blend-mode:
        soft-light;

    color:
        var(--main);

    font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    min-height:
        100vh;

    margin:
        0;

    display:
        flex;

    flex-direction:
        column;

    align-items:
        center;

    justify-content:
        center;

    overflow:
        hidden;

    transition:
        background .5s,
        color .5s;
}

/* =====================================================
   CONTROL PANEL
===================================================== */

.control-panel {

    position:
        absolute;

    top:
        20px;

    right:
        20px;

    display:
        flex;

    flex-direction:
        column;

    gap:
        8px;

    padding:
        12px;

    background:
        var(--panel);

    border:
        1px solid var(--border);

    border-radius:
        8px;

    box-shadow:
        0 0 18px var(--glow);

    backdrop-filter:
        blur(10px);

    z-index:
        20;
}

.control-panel label {

    font-size:
        10px;

    font-weight:
        bold;

    letter-spacing:
        1px;
}

select {

    background:
        #000;

    color:
        var(--main);

    border:
        1px solid var(--border);

    border-radius:
        5px;

    padding:
        7px;

    font-size:
        12px;

    font-weight:
        bold;

    outline:
        none;
}

/* =====================================================
   CORE
===================================================== */

.core {

    width:
        145px;

    height:
        145px;

    border:
        3px solid var(--main);

    border-radius:
        50%;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    cursor:
        pointer;

    user-select:
        none;

    font-weight:
        bold;

    letter-spacing:
        3px;

    text-shadow:
        0 0 10px var(--main);

    box-shadow:
        0 0 25px var(--glow),
        0 0 60px var(--glow);

    background:
        rgba(255,255,255,.02);

    margin-bottom:
        8px;

    transition:
        .3s;
}

.core:hover {
    transform:
        scale(1.04);
}

.core.listening {

    animation:
        listeningPulse .8s infinite alternate;

    border-color:
        #ff1744;

    color:
        #ff1744;

    box-shadow:
        0 0 30px #ff1744,
        0 0 70px #ff1744;
}

.core.speaking {

    animation:
        speakingPulse .65s infinite alternate;
}

@keyframes listeningPulse {

    from {
        transform:scale(1);
    }

    to {
        transform:scale(1.07);
    }
}

@keyframes speakingPulse {

    from {
        transform:scale(1);
    }

    to {
        transform:scale(1.04);
    }
}

/* =====================================================
   STATUS
===================================================== */

.status {

    font-size:
        11px;

    letter-spacing:
        3px;

    text-transform:
        uppercase;

    text-align:
        center;

    margin-bottom:
        15px;

    max-width:
        90%;
}

/* =====================================================
   CHAT
===================================================== */

#log {

    width:
        85%;

    max-width:
        600px;

    height:
        250px;

    padding:
        15px;

    overflow-y:
        auto;

    border:
        1px solid var(--border);

    border-radius:
        7px;

    background:
        var(--panel);

    backdrop-filter:
        blur(10px);

    font-size:
        14px;

    margin-bottom:
        15px;

    box-shadow:
        0 0 15px var(--glow);
}

.u-line {

    color:
        #fff;

    margin-bottom:
        9px;
}

.j-line {

    color:
        var(--main);

    font-weight:
        bold;

    margin-bottom:
        15px;
}

/* =====================================================
   INPUT
===================================================== */

.input-area {

    width:
        85%;

    max-width:
        600px;

    display:
        flex;

    gap:
        10px;
}

input[type="text"] {

    flex:
        1;

    min-width:
        0;

    background:
        rgba(0,0,0,.55);

    color:
        #fff;

    border:
        1px solid var(--border);

    border-radius:
        5px;

    padding:
        12px;

    font-size:
        14px;

    outline:
        none;
}

button.send-btn {

    background:
        var(--main);

    color:
        var(--button-text);

    border:
        none;

    border-radius:
        5px;

    padding:
        10px 17px;

    font-weight:
        bold;

    cursor:
        pointer;
}

button:disabled {

    opacity:
        .5;
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:650px) {

    .control-panel {

        top:
            10px;

        right:
            10px;
    }

    .core {

        width:
            125px;

        height:
            125px;
    }

    #log {

        width:
            92%;

        height:
            230px;
    }

    .input-area {

        width:
            92%;
    }
}

</style>
</head>

<body class="theme-jarvis">

<!-- =====================================================
     INTERFACE SELECT
===================================================== -->

<div class="control-panel">

    <label>
        ВЫБОР ИНТЕРФЕЙСА
    </label>

    <select id="armor-select">

        <option value="jarvis">
            J.A.R.V.I.S. — СИНИЙ
        </option>

        <option value="mark1">
            MARK I
        </option>

        <option value="mark2">
            MARK II
        </option>

        <option value="mark3">
            MARK III
        </option>

        <option value="mark42">
            MARK XLII
        </option>

        <option value="mark48">
            MARK XLVIII
        </option>

        <option value="america">
            MARK — AMERICAN FLAG 🇺🇸
        </option>

        <option value="mark50">
            MARK L — NANOTECH
        </option>

        <option value="mark85">
            MARK LXXXV
        </option>

    </select>

</div>

<!-- =====================================================
     CORE
===================================================== -->

<div
    class="core"
    id="voice-btn"
>
    JARVIS
</div>

<div
    class="status"
    id="status"
>
    СИСТЕМА СВЯЗИ ГОТОВА
</div>

<!-- =====================================================
     CHAT
===================================================== -->

<div id="log">

    <div class="j-line">
        Джарвис: Система J.A.R.V.I.S.
        активирована, сэр.
    </div>

</div>

<!-- =====================================================
     INPUT
===================================================== -->

<div class="input-area">

    <input
        type="text"
        id="user-input"
        placeholder="Написать Джарвису..."
        autocomplete="off"
    >

    <button
        class="send-btn"
        id="send-btn"
    >
        ВВОД
    </button>

</div>

<script>

/* =====================================================
   ELEMENTS
===================================================== */

const status =
    document.getElementById("status");

const log =
    document.getElementById("log");

const userInput =
    document.getElementById("user-input");

const sendBtn =
    document.getElementById("send-btn");

const voiceBtn =
    document.getElementById("voice-btn");

const armorSelect =
    document.getElementById("armor-select");


/* =====================================================
   THEME
===================================================== */

const savedTheme =
    localStorage.getItem("jarvis-theme");

if (savedTheme) {

    document.body.className =
        "theme-" + savedTheme;

    armorSelect.value =
        savedTheme;
}

armorSelect.addEventListener(
    "change",
    () => {

        const theme =
            armorSelect.value;

        document.body.className =
            "theme-" + theme;

        localStorage.setItem(
            "jarvis-theme",
            theme
        );

    }
);


/* =====================================================
   KOKORO AUDIO
===================================================== */

let currentAudio = null;

let audioUnlocked = false;


/*
 * iPhone Safari иногда требует,
 * чтобы Audio был создан после
 * действия пользователя.
 */

function unlockAudio() {

    if (audioUnlocked) {
        return;
    }

    try {

        const audio =
            new Audio();

        audio.volume = 0;

        audio.src =
            "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=";

        audio.play()
            .catch(() => {});

        audioUnlocked = true;

    } catch (error) {

        console.log(
            "Audio unlock:",
            error
        );

    }
}


/* =====================================================
   STOP AUDIO
===================================================== */

function stopSpeaking() {

    if (currentAudio) {

        try {
            currentAudio.pause();
            currentAudio.currentTime = 0;
        }

        catch (error) {}

        currentAudio = null;
    }

    voiceBtn.classList.remove(
        "speaking"
    );
}


/* =====================================================
   KOKORO SPEAK
===================================================== */

async function speakWithKokoro(text) {

    text =
        String(text || "").trim();

    if (!text) {
        return;
    }

    stopSpeaking();

    voiceBtn.classList.add(
        "speaking"
    );

    status.innerText =
        "ДЖАРВИС ГОВОРИТ, СЭР...";

    try {

        const response =
            await fetch(
                "/api/tts",
                {

                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            text: text
                        })

                }
            );


        if (!response.ok) {

            let errorText =
                "Ошибка Kokoro";

            try {

                const data =
                    await response.json();

                errorText =
                    data?.error ||
                    errorText;

            }

            catch (error) {}

            throw new Error(
                errorText
            );

        }


        const blob =
            await response.blob();


        if (
            !blob ||
            blob.size < 100
        ) {

            throw new Error(
                "Сервер вернул пустое аудио."
            );

        }


        const url =
            URL.createObjectURL(
                blob
            );


        const audio =
            new Audio(url);


        currentAudio =
            audio;


        audio.volume =
            1;


        audio.onended =
            () => {

                URL.revokeObjectURL(
                    url
                );

                if (
                    currentAudio ===
                    audio
                ) {

                    currentAudio =
                        null;

                }

                voiceBtn.classList.remove(
                    "speaking"
                );

                status.innerText =
                    "СИСТЕМА СВЯЗИ ГОТОВА";

            };


        audio.onerror =
            () => {

                URL.revokeObjectURL(
                    url
                );

                if (
                    currentAudio ===
                    audio
                ) {

                    currentAudio =
                        null;

                }

                voiceBtn.classList.remove(
                    "speaking"
                );

                status.innerText =
                    "ОШИБКА ВОСПРОИЗВЕДЕНИЯ АУДИО";

            };


        await audio.play();

    }

    catch (error) {

        console.error(
            "KOKORO PLAY ERROR:",
            error
        );

        voiceBtn.classList.remove(
            "speaking"
        );

        status.innerText =
            "KOKORO: " +
            error.message;

    }

}


/* =====================================================
   ADD MESSAGES
===================================================== */

function addUserMessage(text) {

    const div =
        document.createElement("div");

    div.className =
        "u-line";

    div.textContent =
        "Вы: " + text;

    log.appendChild(div);

    log.scrollTop =
        log.scrollHeight;
}


function addJarvisMessage(text) {

    const div =
        document.createElement("div");

    div.className =
        "j-line";

    div.textContent =
        "Джарвис: " + text;

    log.appendChild(div);

    log.scrollTop =
        log.scrollHeight;
}


/* =====================================================
   ASK JARVIS
===================================================== */

async function askJarvis(text) {

    text =
        String(text || "").trim();

    if (!text) {
        return;
    }

    unlockAudio();

    addUserMessage(text);

    status.innerText =
        "ОБРАБОТКА ДАННЫХ...";

    sendBtn.disabled =
        true;

    userInput.disabled =
        true;

    try {

        const response =
            await fetch(
                "/api/chat",
                {

                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            message:
                                text
                        })

                }
            );


        let data;

        try {

            data =
                await response.json();

        }

        catch (error) {

            throw new Error(
                "Сервер вернул неправильный ответ."
            );

        }


        if (!response.ok) {

            throw new Error(
                data?.error ||
                "Ошибка сервера."
            );

        }


        if (
            !data?.answer
        ) {

            throw new Error(
                "ИИ не вернул ответ."
            );

        }


        const answer =
            String(
                data.answer
            ).trim();


        addJarvisMessage(
            answer
        );


        /*
         * ВАЖНО:
         * здесь больше НЕТ speechSynthesis.
         *
         * Теперь используется
         * настоящий /api/tts → Kokoro.
         */

        await speakWithKokoro(
            answer
        );

    }

    catch (error) {

        console.error(
            "CHAT ERROR:",
            error
        );

        addJarvisMessage(
            "Сэр, произошла ошибка: " +
            error.message
        );

        status.innerText =
            "ОШИБКА СИСТЕМЫ";

    }

    finally {

        sendBtn.disabled =
            false;

        userInput.disabled =
            false;

        userInput.focus();

    }

}


/* =====================================================
   TEXT INPUT
===================================================== */

sendBtn.addEventListener(
    "click",
    () => {

        const text =
            userInput.value.trim();

        if (!text) {
            return;
        }

        userInput.value =
            "";

        askJarvis(text);

    }
);


userInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            sendBtn.click();

        }

    }
);


/* =====================================================
   SPEECH RECOGNITION
===================================================== */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


let recognition =
    null;

let listening =
    false;

let voiceText =
    "";


if (SpeechRecognition) {

    recognition =
        new SpeechRecognition();


    recognition.lang =
        "ru-RU";


    recognition.continuous =
        false;


    recognition.interimResults =
        false;


    recognition.maxAlternatives =
        1;


    recognition.onstart =
        () => {

            listening =
                true;

            voiceText =
                "";

            voiceBtn.classList.add(
                "listening"
            );

            voiceBtn.innerText =
                "СТОП";

            status.innerText =
                "СЛУШАЮ ВАС, СЭР...";

        };


    recognition.onresult =
        event => {

            const result =
                event.results?.[0]?.[0];

            if (!result) {
                return;
            }

            const text =
                result.transcript
                    .trim();

            if (text) {

                voiceText =
                    text;

                status.innerText =
                    "УСЛЫШАЛ: " + text;

            }

        };


    recognition.onerror =
        event => {

            console.error(
                "MIC ERROR:",
                event.error
            );


            if (
                event.error ===
                "not-allowed"
            ) {

                status.innerText =
                    "РАЗРЕШИТЕ МИКРОФОН В SAFARI";

            }

            else if (
                event.error ===
                "no-speech"
            ) {

                status.innerText =
                    "Я НЕ УСЛЫШАЛ ВАС, СЭР";

            }

            else if (
                event.error ===
                "audio-capture"
            ) {

                status.innerText =
                    "МИКРОФОН НЕДОСТУПЕН";

            }

            else {

                status.innerText =
                    "ОШИБКА МИКРОФОНА";

            }

        };


    recognition.onend =
        () => {

            listening =
                false;

            voiceBtn.classList.remove(
                "listening"
            );

            voiceBtn.innerText =
                "JARVIS";


            if (voiceText) {

                const text =
                    voiceText;

                voiceText =
                    "";

                askJarvis(
                    text
                );

            }

            else if (
                status.innerText ===
                "СЛУШАЮ ВАС, СЭР..."
            ) {

                status.innerText =
                    "СИСТЕМА СВЯЗИ ГОТОВА";

            }

        };


    voiceBtn.addEventListener(
        "click",
        () => {

            unlockAudio();


            if (listening) {

                recognition.stop();

                return;

            }


            voiceText =
                "";


            try {

                recognition.start();

            }

            catch (error) {

                console.error(
                    error
                );

            }

        }
    );

}

else {

    status.innerText =
        "ГОЛОСОВОЙ РЕЖИМ НЕ ПОДДЕРЖИВАЕТСЯ";

}

</script>

</body>
</html>
