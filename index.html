<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>J.A.R.V.I.S.</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle at center, #073c78 0%, #031b46 40%, #010b20 100%);
    color: #e9fbff;
    font-family: Arial, Helvetica, sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;
}

.container {
    width: min(900px, 100%);
    text-align: center;
}

.logo {
    width: 190px;
    height: 190px;

    margin: 0 auto 25px;

    border: 3px solid #00eaff;
    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #00eaff;
    font-size: 27px;
    font-weight: bold;
    letter-spacing: 7px;

    box-shadow:
        0 0 15px #00eaff,
        0 0 40px rgba(0, 234, 255, 0.6),
        inset 0 0 30px rgba(0, 234, 255, 0.15);

    animation: pulse 2.5s infinite;
}

@keyframes pulse {
    0%, 100% {
        box-shadow:
            0 0 15px #00eaff,
            0 0 40px rgba(0, 234, 255, 0.5);
    }

    50% {
        box-shadow:
            0 0 25px #00eaff,
            0 0 70px rgba(0, 234, 255, 0.8);
    }
}

.status {
    font-size: 18px;
    letter-spacing: 4px;
    margin-bottom: 25px;
    color: #00eaff;
}

.chat {
    height: 430px;
    overflow-y: auto;

    padding: 25px;

    border: 1px solid rgba(0, 234, 255, 0.5);
    border-radius: 14px;

    background: rgba(2, 15, 40, 0.65);

    box-shadow:
        0 0 25px rgba(0, 234, 255, 0.15);

    text-align: left;
}

.message {
    margin-bottom: 22px;
    line-height: 1.5;
    font-size: 18px;
}

.jarvis {
    color: #00eaff;
    font-weight: bold;
}

.user {
    color: white;
    font-weight: bold;
}

.system {
    color: #ff4f91;
    font-weight: bold;
}

.input-area {
    display: flex;
    gap: 12px;
    margin-top: 20px;
}

input {
    flex: 1;

    padding: 18px;

    border-radius: 10px;
    border: 2px solid #00eaff;

    background: rgba(0, 0, 0, 0.45);
    color: white;

    font-size: 18px;
    outline: none;

    box-shadow: 0 0 15px rgba(0, 234, 255, 0.3);
}

button {
    padding: 0 30px;

    border: none;
    border-radius: 10px;

    background: #00eaff;
    color: #00233b;

    font-size: 18px;
    font-weight: bold;

    cursor: pointer;

    box-shadow: 0 0 20px rgba(0, 234, 255, 0.6);
}

button:disabled {
    opacity: 0.5;
    cursor: wait;
}

@media (max-width: 600px) {

    .logo {
        width: 140px;
        height: 140px;
        font-size: 20px;
    }

    .chat {
        height: 400px;
    }

    .input-area {
        flex-direction: column;
    }

    button {
        height: 55px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">
        JARVIS
    </div>

    <div class="status" id="status">
        СИСТЕМА СВЯЗИ ГОТОВА
    </div>

    <div class="chat" id="chat">

        <div class="message jarvis">
            Джарвис: Система J.A.R.V.I.S. активирована, сэр.
            Центральный интеллект готов к работе.
        </div>

    </div>

    <div class="input-area">

        <input
            id="message"
            type="text"
            placeholder="Написать Джарвису..."
            autocomplete="off"
        >

        <button id="send">
            ВВОД
        </button>

    </div>

</div>

<script>

const input = document.getElementById("message");
const button = document.getElementById("send");
const chat = document.getElementById("chat");
const status = document.getElementById("status");

function addMessage(text, type) {

    const div = document.createElement("div");

    div.className = "message " + type;

    div.textContent = text;

    chat.appendChild(div);

    chat.scrollTop = chat.scrollHeight;
}

async function sendMessage() {

    const message = input.value.trim();

    if (!message) return;

    addMessage("Вы: " + message, "user");

    input.value = "";

    button.disabled = true;
    input.disabled = true;

    status.textContent = "ЦЕНТРАЛЬНЫЙ ИНТЕЛЛЕКТ ОБРАБАТЫВАЕТ ЗАПРОС...";

    try {

        const response = await fetch("/api/chat", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                message: message
            })

        });

        const data = await response.json();

        if (!response.ok) {

            throw new Error(
                data?.error ||
                "Сервер вернул ошибку."
            );

        }

        if (!data.answer) {

            throw new Error(
                "ИИ не вернул ответ."
            );

        }

        addMessage(
            "Джарвис: " + data.answer,
            "jarvis"
        );

        status.textContent = "СИСТЕМА СВЯЗИ ГОТОВА";

    } catch (error) {

        console.error(error);

        addMessage(
            "Система: Сэр, произошла ошибка соединения с центральным интеллектом: " +
            error.message,
            "system"
        );

        status.textContent = "ОШИБКА СИСТЕМЫ";

    } finally {

        button.disabled = false;
        input.disabled = false;

        input.focus();
    }
}

button.addEventListener("click", sendMessage);

input.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
        sendMessage();
    }

});

</script>

</body>
</html>
