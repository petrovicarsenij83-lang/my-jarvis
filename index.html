<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. Armor Control</title>
    <style>
        /* Базовые настройки тем для костюмов */
        :root {
            --bg-color: #060d1a;
            --main-color: #00e5ff;
            --main-glow: rgba(0, 229, 255, 0.4);
            --panel-bg: rgba(0, 15, 30, 0.6);
            --input-border: #00e5ff;
        }

        /* Марк 1: Стальной / Пещерный */
        .theme-mark1 {
            --bg-color: #15181c;
            --main-color: #e0e0e0;
            --main-glow: rgba(255, 255, 255, 0.2);
            --panel-bg: rgba(40, 45, 50, 0.6);
            --input-border: #555555;
        }

        /* Марк 2: Хром / Серебро */
        .theme-mark2 {
            --bg-color: #0f141d;
            --main-color: #a4c2f4;
            --main-glow: rgba(164, 194, 244, 0.5);
            --panel-bg: rgba(20, 30, 45, 0.6);
            --input-border: #a4c2f4;
        }

        /* Марк 3: Классический Красно-Золотой */
        .theme-mark3 {
            --bg-color: #220505;
            --main-color: #ffcc00;
            --main-glow: rgba(255, 204, 0, 0.4);
            --panel-bg: rgba(80, 10, 10, 0.6);
            --input-border: #ff3333;
        }

        /* Марк 50: Нанотехнологичный Бордовый */
        .theme-mark50 {
            --bg-color: #1a020d;
            --main-color: #00ffcc;
            --main-glow: rgba(0, 255, 204, 0.5);
            --panel-bg: rgba(60, 5, 25, 0.6);
            --input-border: #ff0055;
        }

        body {
            background-color: var(--bg-color); color: var(--main-color);
            font-family: system-ui, -apple-system, sans-serif;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            height: 90vh; margin: 0; overflow: hidden;
            transition: all 0.5s ease;
        }
        
        /* Выпадающий список выбора брони */
        .selector-area {
            position: absolute; top: 20px; right: 20px;
            display: flex; flex-direction: column; gap: 5px;
        }
        .selector-area label { font-size: 10px; letter-spacing: 1px; font-weight: bold; }
        select {
            background: var(--bg-color); border: 1px solid var(--main-color);
            color: var(--main-color); padding: 8px; border-radius: 4px;
            font-size: 12px; font-weight: bold; outline: none; cursor: pointer;
            transition: all 0.3s;
        }

        .core {
            width: 130px; height: 130px;
            border: 3px solid var(--main-color); border-radius: 50%;
            box-shadow: 0 0 30px var(--main-glow);
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; cursor: pointer; text-shadow: 0 0 10px var(--main-color);
            background: rgba(255, 255, 255, 0.01); margin-bottom: 5px;
            transition: all 0.5s ease;
            letter-spacing: 2px;
        }
        .core:active { transform: scale(0.95); }
        .listening { animation: pulse 1.5s infinite alternate; border-color: #ff0055; box-shadow: 0 0 40px #ff0055; text-shadow: 0 0 10px #ff0055; color: #ff0055; }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }
        .status { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 15px; text-align: center; }
        #log {
            width: 85%; max-width: 500px; height: 180px;
            border: 1px solid rgba(255, 255, 255, 0.1); background: var(--panel-bg);
            padding: 15px; overflow-y: auto; font-size: 14px; border-radius: 6px; margin-bottom: 15px;
            transition: all 0.5s ease;
        }
        .u-line { color: #fff; margin-bottom: 6px; }
        .j-line { color: var(--main-color); margin-bottom: 12px; font-weight: bold; }
        .input-area { display: flex; width: 85%; max-width: 500px; gap: 10px; }
        input {
            flex: 1; background: rgba(0, 0, 0, 0.4); border: 1px solid var(--input-border);
            color: #fff; padding: 10px; border-radius: 4px; font-size: 14px; outline: none;
            transition: all 0.5s ease;
        }
        button.send-btn {
            background: var(--main-color); border: none; color: #060d1a;
            padding: 10px 15px; border-radius: 4px; font-weight: bold; cursor: pointer;
            transition: all 0.5s ease;
        }
    </style>
</head>
<body>

    <div class="selector-area">
        <label>ИНТЕРФЕЙС БРОНИ:</label>
        <select id="armor-select">
            <option value="default">J.A.R.V.I.S. СТАНДАРТ</option>
            <option value="mark1">MARK I (ПЕЩЕРА)</option>
            <option value="mark2">MARK II (ХРОМ)</option>
            <option value="mark3">MARK III (КЛАССИКА)</option>
            <option value="mark50">MARK L (НАНО)</option>
        </select>
    </div>

    <div class="core" id="voice-btn">JARVIS</div>
    <div class="status" id="status">НАЖМИТЕ НА КРУГ ДЛЯ ГОЛОСА ИЛИ НАПИШИТЕ ТЕКСТ</div>
    <div id="log"></div>
    
    <div class="input-area">
        <input type="text" id="user-input" placeholder="Написать Джарвису..." autocomplete="off">
        <button class="send-btn" id="send-btn">ВВОД</button>
    </div>

    <script>
        const status = document.getElementById('status');
        const log = document.getElementById('log');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const voiceBtn = document.getElementById('voice-btn');
        const armorSelect = document.getElementById('armor-select');

        // Логика переключения тем костюмов
        armorSelect.addEventListener('change', (e) => {
            document.body.className = ''; // Сбрасываем старую тему
            const selected = e.target.value;
            if (selected !== 'default') {
                document.body.classList.add('theme-' + selected);
            }
        });

        function unlockAudioiOS() {
            const initialSilence = new SpeechSynthesisUtterance("");
            window.speechSynthesis.speak(initialSilence);
        }

        function audioVoice(text) {
            window.speechSynthesis.cancel();
            const speech = new SpeechSynthesisUtterance(text);
            speech.lang = 'ru-RU';
            window.speechSynthesis.speak(speech);
        }

        async function askJarvis(text) {
            log.innerHTML += `<div class="u-line">Вы: ${text}</div>`;
            log.scrollTop = log.scrollHeight;
            status.innerText = "ПОДКЛЮЧЕНИЕ К СПУТНИКОВОЙ СЕТИ...";

            try {
                const response = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: text })
                });

                const data = await response.json();
                const reply = data.reply;
                
                log.innerHTML += `<div class="j-line">Джарвис: ${reply}</div>`;
                log.scrollTop = log.scrollHeight;
                status.innerText = "СИСТЕМА СВЯЗИ ГОТОВА";
                
                audioVoice(reply);
            } catch (err) {
                status.innerText = "ОШИБКА СЕРВЕРА.";
                console.error(err);
            }
        }

        function handleTextInput() {
            unlockAudioiOS();
            const text = userInput.value.trim();
            if (!text) return;
            userInput.value = '';
            askJarvis(text);
        }

        sendBtn.addEventListener('click', handleTextInput);
        userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleTextInput(); });

        const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (Speech) {
            const rec = new Speech();
            rec.lang = 'ru-RU';

            voiceBtn.addEventListener('click', () => {
                unlockAudioiOS();
                try { 
                    rec.start(); 
                    status.innerText = "СЛУШАЮ ВАС, СЭР..."; 
                    voiceBtn.classList.add('listening');
                } catch(e) { 
                    rec.stop(); 
                }
            });

            rec.onresult = (e) => {
                const speechResult = e.results.transcript;
                if (speechResult) askJarvis(speechResult);
            };

            rec.onerror = () => { status.innerText = "ГОЛОС НЕ РАСПОЗНАН"; };
            rec.onend = () => { 
                voiceBtn.classList.remove('listening');
                if(status.innerText === "СЛУШАЮ ВАС, СЭР...") status.innerText = "СИСТЕМА СВЯЗИ ГОТОВА"; 
            };
        } else {
            status.innerText = "МИКРОФОН НЕ ПОДДЕРЖИВАЕТСЯ.";
        }
    </script>
</body>
</html>
