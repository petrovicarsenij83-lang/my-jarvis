<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. Control Panel</title>

    <style>
        :root {
            --bg: #060d1a;
            --main: #00e5ff;
            --glow: rgba(0,229,255,0.4);
            --panel: rgba(0,15,30,0.6);
            --border: #00e5ff;
        }

        body.theme-mark1 {
            --bg: #15181c;
            --main: #e0e0e0;
            --glow: rgba(255,255,255,0.2);
            --panel: rgba(40,45,50,0.6);
            --border: #555;
        }

        body.theme-mark2 {
            --bg: #0f141d;
            --main: #a4c2f4;
            --glow: rgba(164,194,244,0.5);
            --panel: rgba(20,30,45,0.6);
            --border: #a4c2f4;
        }

        body.theme-mark3 {
            --bg: #220505;
            --main: #ffcc00;
            --glow: rgba(255,204,0,0.4);
            --panel: rgba(80,10,10,0.6);
            --border: #ff3333;
        }

        body.theme-mark50 {
            --bg: #1a020d;
            --main: #00ffcc;
            --glow: rgba(0,255,204,0.5);
            --panel: rgba(60,5,25,0.6);
            --border: #ff0055;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--main);
            font-family: system-ui, sans-serif;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            min-height: 100vh;
            margin: 0;
            padding: 20px;

            overflow: hidden;
            transition: all 0.4s;
        }

        .control-panel {
            position: absolute;
            top: 20px;
            right: 20px;

            display: flex;
            flex-direction: column;
            gap: 8px;

            background: rgba(0,15,30,0.7);
            padding: 12px;

            border-radius: 8px;
            border: 1px solid var(--main);

            box-shadow: 0 0 15px var(--glow);
        }

        .control-panel label {
            font-size: 10px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        select {
            background: #000;
            border: 1px solid var(--main);
            color: var(--main);

            padding: 6px;
            border-radius: 4px;

            font-size: 12px;
            font-weight: bold;

            outline: none;
            cursor: pointer;
        }

        .custom-color-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 4px;
        }

        input[type="color"] {
            -webkit-appearance: none;
            border: none;

            width: 25px;
            height: 25px;

            border-radius: 50%;
            cursor: pointer;

            background: transparent;
        }

        input[type="color"]::-webkit-color-swatch {
            border: 2px solid #fff;
            border-radius: 50%;
        }

        .core {
            width: 130px;
            height: 130px;

            border: 3px solid var(--main);
            border-radius: 50%;

            box-shadow: 0 0 30px var(--glow);

            display: flex;
            align-items: center;
            justify-content: center;

            font-weight: bold;
            cursor: pointer;

            text-shadow: 0 0 10px var(--main);

            background: rgba(255,255,255,0.01);

            margin-bottom: 8px;

            transition: all 0.4s;

            letter-spacing: 2px;

            user-select: none;
        }

        .core:hover {
            box-shadow: 0 0 50px var(--glow);
            transform: scale(1.03);
        }

        .listening {
            animation: pulse 1.5s infinite alternate;

            border-color: #ff0055 !important;
            box-shadow: 0 0 40px #ff0055 !important;

            text-shadow: 0 0 10px #ff0055 !important;
            color: #ff0055 !important;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            100% {
                transform: scale(1.05);
            }
        }

        .status {
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;

            margin-bottom: 15px;

            text-align: center;
        }

        #log {
            width: 85%;
            max-width: 500px;

            height: 220px;

            border: 1px solid rgba(255,255,255,0.1);

            background: var(--panel);

            padding: 15px;

            overflow-y: auto;

            font-size: 14px;

            border-radius: 6px;

            margin-bottom: 15px;

            transition: all 0.4s;

            box-shadow: 0 0 20px rgba(0,0,0,0.3);
        }

        .u-line {
            color: #fff;
            margin-bottom: 6px;
        }

        .j-line {
            color: var(--main);
            margin-bottom: 12px;
            font-weight: bold;
        }

        .input-area {
            display: flex;

            width: 85%;
            max-width: 500px;

            gap: 10px;
        }

        input[type="text"] {
            flex: 1;

            background: rgba(0,0,0,0.4);

            border: 1px solid var(--border);

            color: #fff;

            padding: 10px;

            border-radius: 4px;

            font-size: 14px;

            outline: none;

            transition: all 0.4s;
        }

        input[type="text"]:focus {
            box-shadow: 0 0 12px var(--glow);
        }

        button.send-btn {
            background: var(--main);

            border: none;

            color: #060d1a;

            padding: 10px 15px;

            border-radius: 4px;

            font-weight: bold;

            cursor: pointer;

            transition: all 0.4s;
        }

        button.send-btn:hover {
            box-shadow: 0 0 20px var(--glow);
            transform: translateY(-1px);
        }

        button.send-btn:disabled {
            opacity: 0.5;
            cursor: wait;
        }

        @media (max-width: 600px) {

            body {
                padding-top: 130px;
            }

            .control-panel {
                top: 10px;
                right: 10px;
                left: 10px;
            }

            .core {
                width: 110px;
                height: 110px;
            }

            #log {
                width: 95%;
            }

            .input-area {
                width: 95%;
            }

            .status {
                font-size: 9px;
                letter-spacing: 2px;
            }
        }
    </style>
</head>

<body>

    <!-- Панель брони -->

    <div class="control-panel">

        <label>ГОТОВАЯ БРОНЯ:</label>

        <select id="armor-select">

            <option value="default">
                J.A.R.V.I.S. СТАНДАРТ
            </option>

            <option value="mark1">
                MARK I (ПЕЩЕРА)
            </option>

            <option value="mark2">
                MARK II (ХРОМ)
            </option>

            <option value="mark3">
                MARK III (КЛАССИКА)
            </option>

            <option value="mark50">
                MARK L (НАНО)
            </option>

        </select>

        <div class="custom-color-row">

            <label>СВОЙ ЦВЕТ:</label>

            <input
                type="color"
                id="color-picker"
                value="#00e5ff"
            >

        </div>

    </div>


    <!-- Центральное ядро -->

    <div class="core" id="voice-btn">
        JARVIS
    </div>

    <div class="status" id="status">
        НАЖМИТЕ НА КРУГ ДЛЯ ГОЛОСА ИЛИ НАПИШИТЕ ТЕКСТ
    </div>


    <!-- История -->

    <div id="log"></div>


    <!-- Поле ввода -->

    <div class="input-area">

        <input
            type="text"
            id="user-input"
            placeholder="Написать Джарвису..."
            autocomplete="off"
        >

        <button
            class="send-btn"
            id="send-btn"
        >
            ВВОД
        </button>

    </div>


    <script>

        const status =
            document.getElementById("status");

        const log =
            document.getElementById("log");

        const userInput =
            document.getElementById("user-input");

        const sendBtn =
            document.getElementById("send-btn");

        const voiceBtn =
            document.getElementById("voice-btn");

        const armorSelect =
            document.getElementById("armor-select");

        const colorPicker =
            document.getElementById("color-picker");


        // =========================================
        // БРОНЯ
        // =========================================

        armorSelect.addEventListener("change", (e) => {

            document.body.className = "";

            const selected = e.target.value;

            if (selected !== "default") {

                document.body.classList.add(
                    "theme-" + selected
                );

                const styles =
                    getComputedStyle(document.body);

                const color =
                    styles.getPropertyValue("--main").trim();

                colorPicker.value = color;

            } else {

                document.documentElement.style
                    .setProperty("--main", "#00e5ff");

                document.documentElement.style
                    .setProperty(
                        "--glow",
                        "rgba(0,229,255,0.4)"
                    );

                document.documentElement.style
                    .setProperty("--border", "#00e5ff");

                colorPicker.value = "#00e5ff";
            }
        });


        // =========================================
        // СОБСТВЕННЫЙ ЦВЕТ
        // =========================================

        colorPicker.addEventListener("input", (e) => {

            armorSelect.value = "default";

            document.body.className = "";

            const hex = e.target.value;

            document.documentElement.style
                .setProperty("--main", hex);

            document.documentElement.style
                .setProperty("--border", hex);

            const r =
                parseInt(hex.substring(1, 3), 16);

            const g =
                parseInt(hex.substring(3, 5), 16);

            const b =
                parseInt(hex.substring(5, 7), 16);

            document.documentElement.style
                .setProperty(
                    "--glow",
                    `rgba(${r}, ${g}, ${b}, 0.4)`
                );
        });


        // =========================================
        // ГОЛОС
        // =========================================

        function unlockAudioiOS() {

            if ("speechSynthesis" in window) {

                const speech =
                    new SpeechSynthesisUtterance("");

                window.speechSynthesis.speak(speech);
            }
        }


        function audioVoice(text) {

            if (!("speechSynthesis" in window)) {
                return;
            }

            window.speechSynthesis.cancel();

            const speech =
                new SpeechSynthesisUtterance(text);

            speech.lang = "ru-RU";

            speech.rate = 0.95;
            speech.pitch = 0.9;
            speech.volume = 1;

            window.speechSynthesis.speak(speech);
        }


        // =========================================
        // ЭКРАН
        // =========================================

        function addUserMessage(text) {

            const div =
                document.createElement("div");

            div.className = "u-line";

            div.textContent =
                "Вы: " + text;

            log.appendChild(div);

            log.scrollTop = log.scrollHeight;
        }


        function addJarvisMessage(text) {

            const div =
                document.createElement("div");

            div.className = "j-line";

            div.textContent =
                "Джарвис: " + text;

            log.appendChild(div);

            log.scrollTop = log.scrollHeight;
        }


        // =========================================
        // ОСНОВНОЙ ИИ
        // =========================================

        async function askJarvis(text) {

            if (!text || !text.trim()) {
                return;
            }

            addUserMessage(text);

            status.innerText =
                "J.A.R.V.I.S. ОБРАБАТЫВАЕТ ЗАПРОС...";

            sendBtn.disabled = true;

            try {

                const response =
                    await fetch("/api/chat", {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            message: text
                        })
                    });


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.error ||
                        "Ошибка сервера"
                    );
                }


                const reply =
                    data.reply;


                addJarvisMessage(reply);


                status.innerText =
                    "СИСТЕМА СВЯЗИ ГОТОВА";


                audioVoice(reply);


            } catch (error) {

                console.error(error);


                const errorMessage =
                    "Сэр, произошла ошибка соединения с центральным интеллектом.";


                addJarvisMessage(
                    errorMessage
                );


                status.innerText =
                    "ОШИБКА СИСТЕМЫ";


                audioVoice(
                    errorMessage
                );

            } finally {

                sendBtn.disabled = false;

                userInput.focus();
            }
        }


        // =========================================
        // ТЕКСТ
        // =========================================

        function handleTextInput() {

            unlockAudioiOS();

            const text =
                userInput.value.trim();

            if (!text) {
                return;
            }

            userInput.value = "";

            askJarvis(text);
        }


        sendBtn.addEventListener(
            "click",
            handleTextInput
        );


        userInput.addEventListener(
            "keydown",
            (e) => {

                if (e.key === "Enter") {

                    handleTextInput();
                }
            }
        );


        // =========================================
        // РАСПОЗНАВАНИЕ РЕЧИ
        // =========================================

        const SpeechRecognition =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;


        if (SpeechRecognition) {

            const rec =
                new SpeechRecognition();

            rec.lang = "ru-RU";

            rec.continuous = false;

            rec.interimResults = false;


            voiceBtn.addEventListener(
                "click",
                () => {

                    unlockAudioiOS();

                    try {

                        rec.start();

                        status.innerText =
                            "СЛУШАЮ ВАС, СЭР...";

                        voiceBtn.classList.add(
                            "listening"
                        );

                    } catch (error) {

                        console.log(error);
                    }
                }
            );


            rec.onresult = (event) => {

                const transcript =
                    event.results[0][0].transcript;

                if (transcript) {

                    askJarvis(transcript);
                }
            };


            rec.onerror = (event) => {

                console.error(
                    "Speech recognition:",
                    event.error
                );

                status.innerText =
                    "ГОЛОС НЕ РАСПОЗНАН";

                voiceBtn.classList.remove(
                    "listening"
                );
            };


            rec.onend = () => {

                voiceBtn.classList.remove(
                    "listening"
                );

                if (
                    status.innerText ===
                    "СЛУШАЮ ВАС, СЭР..."
                ) {

                    status.innerText =
                        "СИСТЕМА СВЯЗИ ГОТОВА";
                }
            };

        } else {

            status.innerText =
                "ГОЛОСОВОЕ УПРАВЛЕНИЕ НЕ ПОДДЕРЖИВАЕТСЯ";
        }


        // =========================================
        // ПРИВЕТСТВИЕ
        // =========================================

        window.addEventListener(
            "load",
            () => {

                setTimeout(() => {

                    addJarvisMessage(
                        "Система J.A.R.V.I.S. активирована, сэр. Центральный интеллект готов к работе."
                    );

                }, 500);
            }
        );

    </script>

</body>
</html>
