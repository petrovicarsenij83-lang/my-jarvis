<script>

const status = document.getElementById("status");
const log = document.getElementById("log");
const userInput = document.getElementById("user-input");
const sendBtn = document.getElementById("send-btn");
const voiceBtn = document.getElementById("voice-btn");


// =====================================================
// ГОЛОС JARVIS
// =====================================================

function speak(text) {

    if (!("speechSynthesis" in window)) {
        return;
    }

    speechSynthesis.cancel();

    const speech = new SpeechSynthesisUtterance(text);

    speech.lang = "ru-RU";
    speech.rate = 0.92;
    speech.pitch = 0.85;
    speech.volume = 1;

    speechSynthesis.speak(speech);
}


// =====================================================
// СООБЩЕНИЯ
// =====================================================

function addUserMessage(text) {

    const div = document.createElement("div");

    div.className = "u-line";

    div.textContent = "Вы: " + text;

    log.appendChild(div);

    log.scrollTop = log.scrollHeight;
}


function addJarvisMessage(text) {

    const div = document.createElement("div");

    div.className = "j-line";

    div.textContent = "Джарвис: " + text;

    log.appendChild(div);

    log.scrollTop = log.scrollHeight;
}


// =====================================================
// ОТПРАВКА В ИИ
// =====================================================

async function askJarvis(text) {

    text = String(text || "").trim();

    if (!text) {
        return;
    }

    addUserMessage(text);

    status.innerText =
        "ОБРАБОТКА ДАННЫХ ЦЕНТРАЛЬНЫМ ИНТЕЛЛЕКТОМ...";

    sendBtn.disabled = true;
    userInput.disabled = true;

    try {

        const response = await fetch("/api/chat", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                message: text
            })

        });


        const data = await response.json();


        if (!response.ok) {

            throw new Error(
                data?.error ||
                "Ошибка сервера"
            );

        }


        if (!data.answer) {

            throw new Error(
                "ИИ не вернул ответ"
            );

        }


        addJarvisMessage(data.answer);

        speak(data.answer);

        status.innerText =
            "СИСТЕМА СВЯЗИ ГОТОВА";

    }

    catch (error) {

        console.error(
            "JARVIS ERROR:",
            error
        );

        addJarvisMessage(
            "Сэр, произошла ошибка: " +
            error.message
        );

        status.innerText =
            "ОШИБКА ЦЕНТРАЛЬНОГО ИНТЕЛЛЕКТА";

    }

    finally {

        sendBtn.disabled = false;
        userInput.disabled = false;

        userInput.focus();

    }
}


// =====================================================
// ТЕКСТОВЫЙ ВВОД
// =====================================================

sendBtn.addEventListener(
    "click",
    () => {

        const text =
            userInput.value.trim();

        userInput.value = "";

        askJarvis(text);

    }
);


userInput.addEventListener(
    "keydown",
    event => {

        if (event.key === "Enter") {

            sendBtn.click();

        }

    }
);


// =====================================================
// ГОЛОСОВОЙ ВВОД
// =====================================================

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


let recognition = null;

let listening = false;

let finalTranscript = "";

let interimTranscript = "";


// =====================================================
// ЕСЛИ БРАУЗЕР ПОДДЕРЖИВАЕТ МИКРОФОН
// =====================================================

if (SpeechRecognition) {

    recognition =
        new SpeechRecognition();


    // Русский язык
    recognition.lang =
        "ru-RU";


    // НЕ заканчивать после каждой маленькой фразы
    recognition.continuous =
        true;


    // Показывать промежуточный текст
    recognition.interimResults =
        true;


    recognition.maxAlternatives =
        1;


    // =================================================
    // НАЧАЛО СЛУШАНИЯ
    // =================================================

    recognition.onstart = () => {

        listening = true;

        finalTranscript = "";

        interimTranscript = "";

        voiceBtn.classList.add(
            "listening"
        );

        voiceBtn.innerText =
            "🔴 СТОП";

        status.innerText =
            "СЛУШАЮ ВАС, СЭР...";

    };


    // =================================================
    // ПОЛУЧЕНИЕ РЕЗУЛЬТАТА
    // =================================================

    recognition.onresult = event => {

        let finalText = "";
        let interimText = "";


        for (
            let i = event.resultIndex;
            i < event.results.length;
            i++
        ) {

            const text =
                event.results[i][0].transcript;


            if (
                event.results[i].isFinal
            ) {

                finalText +=
                    text + " ";

            }

            else {

                interimText +=
                    text;

            }

        }


        if (finalText) {

            finalTranscript +=
                finalText;

        }


        interimTranscript =
            interimText;


        // Показываем пользователю,
        // что именно услышал микрофон

        status.innerText =
            "УСЛЫШАЛ: " +
            (
                finalTranscript +
                interimTranscript
            ).trim();

    };


    // =================================================
    // ОШИБКА
    // =================================================

    recognition.onerror = event => {

        console.error(
            "VOICE ERROR:",
            event.error
        );


        // Если просто закончилось распознавание —
        // не показываем страшную ошибку

        if (
            event.error === "no-speech"
        ) {

            status.innerText =
                "Я НЕ УСЛЫШАЛ КОМАНДУ, СЭР";

            return;

        }


        if (
            event.error === "not-allowed"
        ) {

            status.innerText =
                "РАЗРЕШИТЕ ДОСТУП К МИКРОФОНУ";

            return;

        }


        status.innerText =
            "ОШИБКА МИКРОФОНА: " +
            event.error;

    };


    // =================================================
    // КОНЕЦ РАСПОЗНАВАНИЯ
    // =================================================

    recognition.onend = () => {

        console.log(
            "Recognition ended"
        );


        /*
         * ВАЖНО:
         *
         * Если пользователь сам нажал СТОП,
         * отправляем накопленный текст.
         */

        if (listening) {

            /*
             * Некоторые браузеры iPhone
             * сами останавливают recognition.
             *
             * Поэтому автоматически
             * перезапускаем его.
             */

            try {

                recognition.start();

                return;

            }

            catch (e) {

                console.log(
                    "Не удалось перезапустить:",
                    e
                );

            }

        }


        voiceBtn.classList.remove(
            "listening"
        );

        voiceBtn.innerText =
            "JARVIS";


        status.innerText =
            "СИСТЕМА СВЯЗИ ГОТОВА";

    };


    // =================================================
    // КНОПКА JARVIS
    // =================================================

    voiceBtn.addEventListener(
        "click",
        () => {


            // =========================================
            // ЕСЛИ УЖЕ СЛУШАЕМ
            // =========================================

            if (listening) {

                listening = false;


                /*
                 * Сначала останавливаем микрофон.
                 */

                try {

                    recognition.stop();

                }

                catch (e) {

                    console.log(e);

                }


                /*
                 * Берём всё, что услышали.
                 */

                const text =
                    (
                        finalTranscript +
                        " " +
                        interimTranscript
                    ).trim();


                /*
                 * Очищаем переменные.
                 */

                finalTranscript = "";

                interimTranscript = "";


                /*
                 * Если что-то услышали —
                 * отправляем Джарвису.
                 */

                if (text) {

                    status.innerText =
                        "ПЕРЕДАЮ КОМАНДУ ДЖАРВИСУ...";

                    askJarvis(text);

                }

                else {

                    status.innerText =
                        "ГОЛОС НЕ РАСПОЗНАН";

                }


                return;

            }


            // =========================================
            // НАЧИНАЕМ СЛУШАТЬ
            // =========================================

            finalTranscript = "";

            interimTranscript = "";

            try {

                recognition.start();

            }

            catch (error) {

                console.error(
                    "START ERROR:",
                    error
                );

            }

        }
    );

}


// =====================================================
// БРАУЗЕР НЕ ПОДДЕРЖИВАЕТ ГОЛОС
// =====================================================

else {

    voiceBtn.innerText =
        "🎙️ ГОЛОС НЕ ПОДДЕРЖИВАЕТСЯ";

    voiceBtn.disabled =
        true;

    status.innerText =
        "ГОЛОСОВОЙ РЕЖИМ НЕДОСТУПЕН";

}

</script>
